[workspace]

members = [
    "crates/memdb",
    "crates/core",
    "crates/blob",
    "crates/server",
    "crates/cli",
    "crates/admin",
    "crates/smtp",
]

resolver = "2"

[workspace.package]
version = "2.0.3"
edition = "2021"

[workspace.dependencies]
chrono = "0.4.45"
clap = { version = "4.6", features = ["derive", "env"] }
bichon-memdb = { path = "crates/memdb" }
bichon-blob = { path = "crates/blob" }
itertools = "0.15.0"
ring = { version = "0.17.14", features = ["std"] }
subtle = "2.6"
argon2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
base64 = "0.23"
snafu = "0.9"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "stream",
    #"native-tls",
    "rustls-tls",
    "blocking",
    "socks",
] }
tokio-socks = "0.5.3"
http = "1.5"
regex = "1.13"
email_address = "0.2.9"
futures = "0.3"
utf7-imap = "0.3.2"
mail-parser = { version = '0.11', features = ["serde"] }
# mail-send = "0.5.2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
timeago = "0.6.1"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
url = { version = "2.5.8", features = ["serde"] }
sysinfo = "0.39"
num_cpus = "1.17.0"
rand = "0.10.2"
encoding_rs = "0.8.35"
webpki-roots = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1.15"
tokio-io-timeout = "1.2.1"
semver = "1.0.28"
governor = "0.10.4"
lru = "0.18"
mime_guess = "2.0.5"
hex = "0.4.3"
time = { version = "0.3", features = [
    "formatting",
    "parsing",
    "local-offset",
] }
rust-embed = "8.12"
murmur3 = "0.5.2"
urlencoding = "2.1.3"
dashmap = "6.2.1"
gethostname = "1.1.0"
itoa = "1.0.18"
html2text = "0.17.1"
bytes = "1.12"
dialoguer = "0.12.0"
console = "0.16.4"
mail-send = "0.6"
rcgen = "0.14"
rustls-pemfile = "2.2.0"
blake3 = "1.8"
uuid = { version = "1.26", features = ["v4", "serde"] }
fjall = { version = "3.1", features = ["lz4", "metrics", "bytes_1"] }
tracing-log = "0.2.0"
tokio-util = "0.7"
indicatif = "0.18.6"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
